name: Web-first CI

on:
  push:
    branches: [ "web-first-mvp", "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  validate-web-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci --include=dev

      - name: Frontend typecheck and build
        working-directory: tauri-app
        run: npm run build

      - name: Rust format check
        working-directory: tauri-app
        run: cargo fmt --all -- --check

      - name: Rust check
        working-directory: tauri-app
        run: cargo check -p micyou-app --all-targets

      - name: Web server unit tests
        working-directory: tauri-app
        run: cargo test -p micyou-app web_server::tests --lib
